[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "hamaton-sdk-python"
version = "0.0.1"
description = "Python SDK for the Hamaton TPMS Board UART protocol."
readme = "README.md"
requires-python = ">=3.10"
authors = [
    { name = "stokastIQ" }
]
dependencies = []

[project.optional-dependencies]
uart = [
    "pyserial>=3.5"
]
dev = [
    "pytest>=8.0",
    "ruff>=0.6",
    "pyserial>=3.5"
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.ruff]
line-length = 88
target-version = "py310"
